[project]
name = "sourdough-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
]

[project.scripts]
sourdough-monitor = "sourdough_monitor:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
